<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- The app icon: a pawn that is also a lapwing (German "Kiebitz", the kibitzer who watches
       and comments on games): black crown and swept-back crest, eye and beak, black chest band.
       Flat, three colours, on the macOS icon grid (an 824 px rounded square on 1024 px).
       Original artwork, GPL-3.0 like the app. scripts/make_icon.sh builds Kiebitz.icns and
       Kiebitz.png from this file. -->
  <defs>
    <clipPath id="head"><circle cx="512" cy="380" r="112"/></clipPath>
  </defs>
  <!-- Lapwing green tile -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#1F6B4E"/>
  <!-- Crest: two feathers sweeping back from the crown, curling up at the tips -->
  <g transform="translate(566,300) scale(1.12)" fill="#0F241C">
    <path d="M -12 2 C 30 -34 92 -54 146 -56 C 168 -57 182 -74 176 -98 C 192 -78 186 -46 150 -40 C 98 -34 44 -16 12 12 Z"/>
    <path d="M -6 10 C 34 -16 80 -28 118 -26 C 136 -25 146 -36 142 -52 C 156 -38 152 -16 124 -14 C 88 -12 50 0 16 20 Z" opacity="0.8"/>
  </g>
  <!-- Head with the black crown -->
  <circle cx="512" cy="380" r="112" fill="#F6F0E2"/>
  <g clip-path="url(#head)">
    <path d="M 390 356 C 420 336 474 328 520 331 C 576 335 620 352 640 382 L 640 230 L 390 230 Z" fill="#0F241C"/>
  </g>
  <!-- Eye and beak -->
  <circle cx="456" cy="388" r="16" fill="#0F241C"/>
  <path d="M 408 400 L 350 426 L 412 420 Z" fill="#0F241C"/>
  <!-- Chest band (the pawn's collar) -->
  <rect x="400" y="490" width="224" height="38" rx="19" fill="#0F241C"/>
  <!-- Body and base -->
  <path d="M 452 528 L 572 528 L 640 742 L 384 742 Z" fill="#F6F0E2" stroke="#F6F0E2" stroke-width="24" stroke-linejoin="round"/>
  <rect x="328" y="744" width="368" height="68" rx="34" fill="#F6F0E2"/>
</svg>
